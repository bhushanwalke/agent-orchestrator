# .github/workflows/fork-release.yml
name: Fork release

# Builds the desktop app on all four platforms and publishes the installers as
# a GitHub release on a FORK of this repository. Every job is gated on
# github.event.repository.fork, so the canonical repository never runs it; its
# releases come from the external release conductor (see build-artifacts.yml).
#
# The release also carries the electron-updater manifests (latest.yml,
# latest-mac.yml, latest-linux.yml) generated by frontend/scripts/feed.mjs, so
# an installed fork build can find the next fork release. The updater's stable
# channel resolves <repo>/releases/latest, which GitHub only points at full
# releases, so a release published as a pre-release is invisible to it.
#
# macOS builds are signed and notarized when the fork defines the six Apple
# secrets that .github/actions/macos-signing-setup consumes; without them the
# build is unsigned and the release notes say how to open it. Squirrel.Mac
# installs only signed updates, so unsigned macOS builds can discover and
# download an update but must still be reinstalled by hand. Windows and Linux
# are always unsigned and auto-update normally.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the app; the release is tagged v<version>"
        type: string
        required: true
      prerelease:
        description: "Mark the release as a pre-release (hidden from the in-app updater)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID }}
  VITE_AO_TEAMS: ${{ vars.VITE_AO_TEAMS }}

jobs:
  build:
    if: ${{ github.event.repository.fork }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    env:
      # Secrets cannot appear in `if:`; this flag can.
      HAS_APPLE_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY_BASE64 != '' }}
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui
      - name: Verify WorkOS build configuration
        shell: bash
        run: |
          if [ -z "$VITE_WORKOS_CLIENT_ID" ]; then
            echo "::error::Repository variable VITE_WORKOS_CLIENT_ID is required for desktop artifacts." >&2
            exit 1
          fi
      - name: Stamp version
        shell: bash
        run: |
          node -e "const v=process.env.BUILD_VERSION.split('+')[0]; const fs=require('fs'); const p=require('./package.json'); p.version=v; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n');"
      - name: Use clang++-15 for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v clang++-15
          echo "CXX=clang++-15" >> "$GITHUB_ENV"
      - name: macOS signing setup
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        uses: ./.github/actions/macos-signing-setup
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key-base64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Build
        shell: bash
        env:
          # Bake the update feed's owner/repo from the fork this build runs in.
          AO_RELEASE_REPO: ${{ github.repository }}
          AO_PUBLISHED_BUILD: "1"
        run: npm run make
      - name: Verify baked update feed repo
        shell: bash
        run: |
          set -euo pipefail
          owner="$(sed -n 's/^owner:[[:space:]]*//p' app-update.yml)"
          repo="$(sed -n 's/^repo:[[:space:]]*//p' app-update.yml)"
          echo "baked feed: $owner/$repo (expected $GITHUB_REPOSITORY)"
          if [ "$owner/$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::app-update.yml bakes $owner/$repo but this build publishes from $GITHUB_REPOSITORY" >&2
            exit 1
          fi
      - name: Collect installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Asset names carry the version: feed.mjs selects the auto-updatable
          # installers by that substring, and electron-updater on macOS picks the
          # arm64 zip by the literal "arm64" in its name. Keep "arm64" out of
          # every other name.
          version="${BUILD_VERSION%%+*}"
          mkdir -p dist-release
          collect() { # collect <source> <release name>
            if [ -z "$1" ]; then echo "no build output found for $2" >&2; exit 1; fi
            cp "$1" "dist-release/$2"
            echo "$2 sha256=$(openssl dgst -sha256 "dist-release/$2" | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
          }
          case "$PLATFORM" in
            darwin-*)
              collect "$(find out/make/zip/darwin -name '*.zip' | head -n1)" "agent-orchestrator-$version-$PLATFORM.zip"
              collect "$(find out/make -maxdepth 1 -name '*.dmg' | head -n1)" "agent-orchestrator-$version-$PLATFORM.dmg"
              if [ "$HAS_APPLE_SIGNING" = "true" ]; then touch dist-release/SIGNED-$PLATFORM; fi
              ;;
            win32-x64)
              collect "$(find out/make -maxdepth 1 -name '*Setup*.exe' | head -n1)" "agent-orchestrator-$version-win32-x64.exe"
              ;;
            linux-x64)
              collect "$(find out/make -maxdepth 1 -name '*.AppImage' | head -n1)" "agent-orchestrator-$version-linux-x64.AppImage"
              collect "$(find out/make -name '*.deb' | head -n1)" "agent-orchestrator-$version-linux-x64.deb"
              collect "$(find out/make -name '*.rpm' | head -n1)" "agent-orchestrator-$version-linux-x64.rpm"
              ;;
            *) echo "unknown platform: $PLATFORM" >&2; exit 1 ;;
          esac
      # Windows and Linux manifests (latest.yml, latest-linux.yml) plus the
      # Windows installer's .blockmap sidecar come from this job, which has the
      # node_modules the blockmap writer needs. The macOS manifest lists both
      # arches in one file, so the publish job builds it after merging.
      - name: Generate update manifest
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import { generateFeeds } from './scripts/feed.mjs'; await generateFeeds('dist-release', process.env.BUILD_VERSION, 'latest', new Date().toISOString());"
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: fork-release-${{ matrix.platform }}
          path: frontend/dist-release/*
          retention-days: 1
          if-no-files-found: error

  publish:
    if: ${{ github.event.repository.fork }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Refuse to overwrite an existing release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists on $GITHUB_REPOSITORY" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: frontend/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fork-release-*
          merge-multiple: true
      - name: Generate macOS update manifest
        shell: bash
        run: |
          set -euo pipefail
          # feed.mjs hashes mac zips without touching the blockmap writer, so the
          # sparse checkout needs no node_modules here.
          mkdir -p macfeed
          cp dist/agent-orchestrator-*-darwin-*.zip macfeed/
          (cd frontend && node --input-type=module -e "import { generateFeeds } from './scripts/feed.mjs'; await generateFeeds('../macfeed', process.env.VERSION, 'latest', new Date().toISOString());")
          cp macfeed/latest-mac.yml dist/
      - name: Verify update manifests
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          for manifest in latest.yml latest-mac.yml latest-linux.yml; do
            if [ ! -f "dist/$manifest" ]; then
              echo "::error::missing update manifest $manifest" >&2
              exit 1
            fi
            echo "== $manifest"; cat "dist/$manifest"
            sed -n 's/^[[:space:]]*-[[:space:]]*url:[[:space:]]*//p' "dist/$manifest" | while read -r asset; do
              if [ ! -f "dist/$asset" ]; then
                echo "::error::$manifest names $asset, which is not among the release assets" >&2
                exit 1
              fi
            done
          done
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          signed_mac=false
          if [ -e dist/SIGNED-darwin-arm64 ] && [ -e dist/SIGNED-darwin-x64 ]; then signed_mac=true; fi
          rm -f dist/SIGNED-*
          {
            echo "Desktop build of \`$GITHUB_REF_NAME\` from this fork, stamped \`$VERSION\`."
            echo
            if [ "$signed_mac" = true ]; then
              echo "- **macOS**: the DMG and zip are signed and notarized. Open the DMG and drag the app to Applications. Apple silicon: darwin-arm64, Intel: darwin-x64. Installed apps update themselves from here."
            else
              echo "- **macOS** (unsigned): open the DMG, drag the app to Applications, then right-click the app and choose **Open** the first time, or run \`xattr -dr com.apple.quarantine \"/Applications/Agent Orchestrator.app\"\`. Apple silicon: darwin-arm64, Intel: darwin-x64. An installed app finds and downloads newer releases, but macOS only auto-installs signed builds, so install each unsigned release the same way."
            fi
            echo "- **Windows** (unsigned): SmartScreen shows an unknown-publisher warning; choose **More info**, then **Run anyway**. Installed apps update themselves from here."
            echo "- **Linux**: \`chmod +x\` the AppImage, or install the .deb or .rpm. The AppImage updates itself from here."
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "This is a pre-release: the in-app updater only follows the latest full release and will not offer it."
            else
              echo "The \`latest*.yml\` files are the in-app updater's manifests; leave them attached."
            fi
            echo
            echo "### SHA-256"
            echo
            echo '```'
            (cd dist && sha256sum -- *)
            echo '```'
          } > notes.md
          cat notes.md
      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" "${args[@]}" dist/*
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
